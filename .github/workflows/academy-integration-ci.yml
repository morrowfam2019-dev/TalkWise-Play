name: Academy Integration CI

on:
  push:
    branches: [academy-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:progress
      - run: npm run verify:speech
      - run: npm run verify:minigames
      - run: npm run build
